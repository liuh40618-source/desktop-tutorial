# 职途 · Nginx 反代配置模板（HTTP/HTTPS）
# 适用：阿里云 ECS / 轻量应用服务器 + Ubuntu（Nginx 已安装）
# 本文件作为 http {} 内的配置加载，以便定义共享速率限制区。

limit_req_zone $binary_remote_addr zone=career_jd_parse:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=career_resume_parse:10m rate=3r/m;

# ---------- HTTPS（推荐）----------
# 证书就绪后启用下面的 server 块；证书路径按你的实际填
server {
    listen 443 ssl http2;
    server_name your-domain.com;          # ← 改成你的域名

    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 常规请求体限制；简历解析接口单独放宽到 6MB。
    client_max_body_size 1m;
    limit_req_status 429;

    location = /api/jds/parse {
        client_max_body_size 64k;
        limit_req zone=career_jd_parse burst=4 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/parse-resume {
        client_max_body_size 6m;
        limit_req zone=career_resume_parse burst=2 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

