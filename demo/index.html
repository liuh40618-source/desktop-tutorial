<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职途 · 交互演示</title>
<style>
  /* ===== 复刻原项目 globals.css 的设计系统 ===== */
  :root {
    --background: #f5f6f8;
    --foreground: #1c1f24;
    --muted: #868d99;
    --border: #e6e8ee;
    --card: #ffffff;
    --accent: #2f6bff;
    --accent-strong: #1f57e6;
    --accent-soft: #eaf1ff;
    --surface-2: #f0f2f6;
    --shadow-sm: 0 1px 3px rgba(20,28,55,.06), 0 1px 2px rgba(20,28,55,.04);
    --ring: rgba(47,107,255,.32);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--background);
    color: var(--foreground);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  .app-shell { max-width: 38rem; margin: 0 auto; padding: 2rem 1rem 4rem; }

  /* 卡片 */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1.25rem;
    box-shadow: var(--shadow-sm);
    padding: 1.5rem;
  }
  @media (min-width:640px) { .card { padding: 1.5rem; } }

  /* 输入框 */
  .input {
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: .9rem;
    padding: .75rem .9rem;
    font-size: .925rem;
    line-height: 1.55;
    color: var(--foreground);
    outline: none;
    transition: border-color .18s ease, box-shadow .18s ease;
    font-family: inherit;
    resize: vertical;
  }
  .input::placeholder { color: #aab0bb; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }

  /* 按钮 */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .45rem;
    border-radius: .9rem;
    padding: .8rem 1.1rem;
    font-size: .9rem;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    border: none;
    transition: transform .12s ease, opacity .18s ease, background .18s ease, border-color .18s ease, box-shadow .18s ease;
    font-family: inherit;
  }
  .btn:active { transform: translateY(1px) scale(.99); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #5b8cff);
    color: #fff;
    box-shadow: 0 8px 20px rgba(47,107,255,.26);
  }
  .btn-primary:hover:not(:disabled) { opacity: .94; }
  .btn-ghost {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--foreground);
  }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
  .w-full { width: 100%; }
  .flex-1 { flex: 1; }
  .gap-3 { gap: .75rem; }
  .flex { display: flex; }
  .mt-6 { margin-top: 1.5rem; }
  .mb-5 { margin-bottom: 1.25rem; }
  .mb-1 { margin-bottom: .25rem; }
  .mb-4 { margin-bottom: 1rem; }
  .mb-3 { margin-bottom: .75rem; }
  .mb-2 { margin-bottom: .5rem; }
  .mt-1 { margin-top: .25rem; }
  .mt-2 { margin-top: .5rem; }
  .mt-5 { margin-top: 1.25rem; }
  .text-sm { font-size: .875rem; }
  .text-xs { font-size: .75rem; }
  .text-lg { font-size: 1.125rem; }
  .text-xl { font-size: 1.25rem; }
  .text-2xl { font-size: 1.5rem; }
  .font-medium { font-weight: 500; }
  .font-semibold { font-weight: 600; }
  .text-muted { color: var(--muted); }
  .text-accent { color: var(--accent); }
  .text-foreground { color: var(--foreground); }
  .tracking-tight { letter-spacing: -.025em; }
  .leading-relaxed { line-height: 1.7; }
  .block { display: block; }
  .space-y-4 > * + * { margin-top: 1rem; }
  .space-y-3 > * + * { margin-top: .75rem; }
  .flex-wrap { flex-wrap: wrap; }
  .gap-2 { gap: .5rem; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .justify-end { justify-content: flex-end; }
  .rounded-full { border-radius: 999px; }
  .rounded-xl { border-radius: .75rem; }
  .p-4 { padding: 1rem; }
  .p-5 { padding: 1.25rem; }
  .px-2 { padding-left: .5rem; padding-right: .5rem; }
  .py-0 { padding-top: 0; padding-bottom: 0; }
  .px-3 { padding-left: .75rem; padding-right: .75rem; }
  .py-1 { padding-top: .25rem; padding-bottom: .25rem; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cursor-pointer { cursor: pointer; }
  .text-left { text-align: left; }
  .min-h-20 { min-height: 5rem; }
  .min-h-24 { min-height: 6rem; }

  /* 标签 chip */
  .chip {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 999px;
    padding: .34rem .78rem;
    font-size: .78rem;
    color: var(--foreground);
  }

  /* 进度条 */
  .track {
    height: 5px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .track > i {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #5b8cff);
    border-radius: 999px;
    transition: width .45s cubic-bezier(.23,1,.32,1);
  }

  /* 动画 */
  @keyframes stepIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .animate-step { animation: stepIn .35s cubic-bezier(.23,1,.32,1) both; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    border: 2px solid rgba(47,107,255,.3);
    border-top-color: var(--accent-strong);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }

  /* Demo 专用样式 */
  .demo-banner {
    background: linear-gradient(135deg, #fff3e0, #ffe0e6);
    border: 1px solid #ffd6a0;
    border-radius: 1rem;
    padding: .75rem 1rem;
    margin-bottom: 1.5rem;
    font-size: .8rem;
    color: #8a5a00;
    line-height: 1.6;
  }

  .step-badge {

    align-items: center;

    padding: .2rem .6rem;
    font-size: .7rem;
    font-weight: 600;

  .job-item {

    align-items: flex-start;
    gap: .75rem;
    width: 100%;

    border-radius: .75rem;

  .job-item.active { border-color: var(--accent); background: rgba(234,241,255,.5); }
  .check-dot {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;

  .match-score {
    font-size: .75rem;
    font-weight: 600;
    color: var(--accent);
    flex-shrink: 0;
  }
  .resource-link {
    display: block;
    border: 1px solid var(--border);
    border-radius: .75rem;
    padding: 1rem;
    text-decoration: none;
    color: inherit;
    transition: border-color .18s;
  }
  .resource-link:hover { border-color: rgba(47,107,255,.4); }
  .platform-tag {
    display: inline-flex;
    align-items: center;
    gap: .2rem;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: .15rem .5rem;
    font-size: .7rem;
    flex-shrink: 0;
  }
  pre.plan-output {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: .75rem;
    padding: 1rem;
    font-size: .75rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 60vh;
    overflow: auto;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  }
  .header-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .header-row h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.025em; cursor: pointer; }
  .header-row .sub { font-size: .75rem; color: var(--muted); margin-top: .25rem; }
  .landing-modules {
    display: grid;
    grid-template-columns: 1fr;
    gap: .75rem;
    margin-top: 1.5rem;
  }
  @media (min-width:640px) { .landing-modules { grid-template-columns: 1fr 1fr; } }
  .landing-module {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1.25rem;
    box-shadow: var(--shadow-sm);
    padding: 1.25rem;
  }
  .landing-module .num { font-size: .75rem; font-weight: 500; letter-spacing: .2em; color: var(--accent); }
  .landing-module h3 { font-size: 1rem; font-weight: 500; margin-top: .5rem; }
  .landing-module p { font-size: .75rem; color: var(--muted); margin-top: .25rem; line-height: 1.6; }
  .field-label { font-size: .875rem; font-weight: 500; display: block; margin-bottom: .4rem; }
  .field-hint { font-size: .75rem; color: var(--muted); display: block; margin-bottom: .4rem; }
  .error-box {
    margin-top: 1rem;
    border: 1px solid rgba(255,99,99,.3);
    background: rgba(255,240,240,.8);
    border-radius: .75rem;
    padding: .75rem 1rem;
    font-size: .875rem;
    color: #c0392b;
  }
  .pos-summary {
    border: 1px solid rgba(47,107,255,.2);
    background: rgba(234,241,255,.6);
    border-radius: .75rem;
    padding: .75rem 1rem;
    font-size: .875rem;
    line-height: 1.7;
    margin-bottom: 1.25rem;
  }
  .skill-block { margin-bottom: 1rem; }
  .skill-block h3 { font-size: .875rem; font-weight: 500; margin-bottom: .5rem; }
  .skill-chips { display: flex; flex-wrap: wrap; gap: .5rem; }
  .step-pills { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .75rem; }
  .step-pill {
    border-radius: 999px;
    padding: .25rem .65rem;
    font-size: .75rem;
    transition: all .18s;
    border: none;
    background: none;
    font-family: inherit;
  }
  .step-pill.current { background: var(--accent); color: #fff; }
  .step-pill.done { color: var(--accent); cursor: pointer; }
  .step-pill.done:hover { background: var(--accent-soft); }
  .step-pill.future { color: var(--muted); cursor: default; }
  .loading-overlay {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    padding: 2rem;
    color: var(--muted);
    font-size: .875rem;
  }
  @media (prefers-reduced-motion: reduce) {
    .animate-step, .track > i, .spinner { animation: none !important; transition: none !important; }
  }
</style>
</head>

// 搜索链接拼接（复刻原项目 resolve_url 逻辑）
const PLATFORM_TEMPLATES = {
  "B站": "https://search.bilibili.com/all?keyword=",
  "知乎": "https://www.zhihu.com/search?type=content&q=",
  "GitHub": "https://github.com/search?q=",
  "Google": "https://www.google.com/search?q=",
  "可汗学院": "https://www.khanacademy.org/search?page_search_query="
};
function resolveUrl(platform, query) {
  const t = PLATFORM_TEMPLATES[platform];
  if (!t) return "https://www.google.com/search?q=" + encodeURIComponent(query);
  return t + encodeURIComponent(query);
}

// ===== 状态 =====
let state = {
  started: false,
  step: 0,
  bg: { major: "", grade: "", works: "", certificates: "", selfDescription: "", interests: "" },
  positioning: null,
  editPos: null,
  jobs: [],
  selectedJob: "",
  skills: null,
  goal: "",
  resources: [],
  loading: false,
  error: null
};

// ===== 模拟异步调用（假延迟） =====
function mockCall(stage) {
  return new Promise((resolve) => {
    setTimeout(() => {
      switch (stage) {
        case "locate": resolve(MOCK.locate); break;
        case "refine_recommend": resolve(MOCK.refine_recommend); break;
        case "skills":
          resolve(MOCK.skills[state.selectedJob] || MOCK.skills["AI 产品交互设计师"]);
          break;
        case "resources":
          const raw = MOCK.resources[state.selectedJob] || MOCK.resources["AI 产品交互设计师"];
          resolve({ resources: raw.map(r => ({ ...r, url: resolveUrl(r.platform, r.query) })) });
          break;
      }
    }, 900 + Math.random() * 600); // 0.9~1.5s 假装在思考
  });
}

// ===== 编译完整规划文本（复刻原项目 compilePlanText） =====
function compilePlanText(d) {
  const lines = ["# 我的职途规划", ""];
  lines.push(`专业：${d.bg.major || "（未填）"}　年级：${d.bg.grade || "（未填）"}`);
  if (d.bg.works) lines.push(`作品/项目：${d.bg.works}`);
  if (d.bg.certificates) lines.push(`证书/技能：${d.bg.certificates}`);
  if (d.bg.interests) lines.push(`兴趣方向：${d.bg.interests}`);
  lines.push("");
  if (d.positioning) {
    lines.push("## 初步定位");
    if (d.positioning.summary) lines.push(`> ${d.positioning.summary}`);
    if (d.positioning.strengths.length) lines.push(`- 优势：${d.positioning.strengths.join("、")}`);
    if (d.positioning.gaps.length) lines.push(`- 短板：${d.positioning.gaps.join("、")}`);
    if (d.positioning.directions.length) lines.push(`- 方向：${d.positioning.directions.join("、")}`);
    lines.push("");
  }
  if (d.jobs.length) {
    lines.push("## 推荐岗位");
    d.jobs.forEach(j => lines.push(`- ${j.title}（匹配度 ${j.matchScore}）：${j.matchReason}`));
    lines.push("");
  }
  if (d.skills) {
    lines.push(`## ${d.selectedJob} · 技能解析`);
    if (d.skills.mustHave.length) lines.push(`- 必备：${d.skills.mustHave.join("、")}`);
    if (d.skills.niceToHave.length) lines.push(`- 加分：${d.skills.niceToHave.join("、")}`);
    if (d.skills.tools.length) lines.push(`- 工具：${d.skills.tools.join("、")}`);
    lines.push("");
  }
  if (d.goal) { lines.push("## 学习目标"); lines.push(d.goal); lines.push(""); }
  if (d.resources.length) {
    lines.push("## 学习资源");
    d.resources.forEach(r => lines.push(`- [${r.title}](${r.url})（${r.platform}）：${r.note}`));
    lines.push("");
  }
  return lines.join("\n").trim() + "\n";
}

// ===== 渲染入口 =====
const app = document.getElementById("app");

function render() {
  app.innerHTML = "";

  // Demo 提示横幅
  const banner = document.createElement("div");
  banner.className = "demo-banner";
  banner.innerHTML = 'Demo 演示模式 · 使用示例假数据模拟 AI 返回，无需 API Key，可直接体验完整 5 步流程。点击 <b>"一键填充示例"</b> 可快速体验。';
  app.appendChild(banner);

  // 头部
  const header = document.createElement("div");
  header.className = "header-row";
  header.innerHTML = `
    <div>
      <h1 onclick="goHome()" title="返回首页">职途</h1>
      <div class="sub">AI 定位方向 · 推荐岗位 · 规划学习路径</div>
    </div>
    ${state.started ? `
      <div class="flex gap-3">
        <button class="btn btn-ghost" style="padding:.4rem .75rem;font-size:.75rem" onclick="goHome()">返回首页</button>
        ${state.step > 0 ? `<button class="btn btn-ghost" style="padding:.4rem .75rem;font-size:.75rem" onclick="reset()">重新开始</button>` : ""}
      </div>
    ` : ""}
  `;
  app.appendChild(header);

  if (!state.started) {
    renderLanding();
  } else {
    renderProgress();
    if (state.error) {
      const ebox = document.createElement("div");
      ebox.className = "error-box";
      ebox.textContent = state.error;
      app.appendChild(ebox);
    }
    const stepContainer = document.createElement("div");
    stepContainer.className = "animate-step";
    stepContainer.style.marginTop = "1.5rem";
    app.appendChild(stepContainer);

    if (state.loading) {
      stepContainer.innerHTML = `<div class="loading-overlay"><span class="spinner"></span> ${getLoadingText()}</div>`;
      return;
    }

    switch (state.step) {
      case 0: renderBackgroundForm(stepContainer); break;
      case 1: renderPositioningEditor(stepContainer); break;
      case 2: renderJobPicker(stepContainer); break;
      case 3: renderSkillView(stepContainer); break;
      case 4: renderResourceView(stepContainer); break;
    }
  }
}

function getLoadingText() {
  const texts = ["正在分析你的背景…", "正在匹配岗位…", "正在解析技能…", "正在规划学习路径…"];
  return texts[state.step] || "思考中…";
}

// ===== 进度条 =====
function renderProgress() {
  const pct = (state.step / (STEPS.length - 1)) * 100;
  const container = document.createElement("div");
  let pills = "";
  STEPS.forEach((label, i) => {
    let cls = "step-pill ";
    if (i === state.step) cls += "current";
    else if (i < state.step) cls += "done";
    else cls += "future";
    const clickable = i < state.step;
    pills += `<button class="${cls}" ${clickable ? `onclick="goToStep(${i})"` : "disabled"}>${i + 1}. ${label}</button>`;
  });
  container.innerHTML = `
    <div class="step-pills">${pills}</div>
    <div class="track"><i style="width:${pct}%"></i></div>
    <p class="text-xs text-muted mt-2">Demo 模式 · 示例数据模拟</p>
  `;
  app.appendChild(container);
}

// ===== Step 0: 背景表单 =====

        <label class="block">
          <span class="field-label">专业 *</span>
          <span class="field-hint">例如：数据科学与大数据技术</span>

          <span class="field-hint">例如：大三 / 研一</span>

          <span class="field-label">自我介绍</span>
          <span class="field-hint">性格、兴趣、想做的事</span>
          <textarea class="input min-h-20" oninput="updateBg('selfDescription', this.value)" placeholder="选填">${escapeHtml(state.bg.selfDescription)}</textarea>
        </label>
        <label class="block">
          <span class="field-label">兴趣方向</span>
          <span class="field-hint">你感兴趣的技术或领域，会影响方向推荐</span>
          <textarea class="input min-h-20" oninput="updateBg('interests', this.value)" placeholder="选填，如：推荐系统、数据可视化">${escapeHtml(state.bg.interests)}</textarea>
        </label>
      </div>
      <button class="btn btn-primary w-full mt-6" onclick="handleLocate()">生成我的定位</button>
    </div>

}

// ===== Step 1: 定位编辑 =====
function renderPositioningEditor(container) {
  if (!state.editPos) return;
  const pos = state.editPos;
  const listEditor = (label, items, key) => `
    <label class="block">
      <span class="field-label">${label}</span>
      <span class="field-hint">每行一条，可自由增删改</span>
      <textarea class="input min-h-24" oninput="updatePosList('${key}', this.value)">${items.join("\n")}</textarea>
    </label>
  `;
  container.innerHTML = `
    <div class="card p-5">
      <span class="step-badge">Step 2 / 5 · 初步定位</span>
      <h2 class="text-lg font-medium mb-1 mt-2">AI 初步定位</h2>
      <p class="text-sm text-muted mb-5">下面是 AI 基于你的信息给出的判断，可直接修改，让它更贴近你。</p>
      <div class="pos-summary">${escapeHtml(pos.summary || "（一句话定位待补充）")}</div>
      <div class="space-y-4">
        ${listEditor("优势", pos.strengths, "strengths")}
        ${listEditor("短板 / 待补齐", pos.gaps, "gaps")}
        ${listEditor("可能的方向", pos.directions, "directions")}
      </div>
      <div class="mt-6 flex gap-3">
        <button class="btn btn-ghost" onclick="goToStep(0)">上一步</button>
        <button class="btn btn-primary flex-1" onclick="handleRecommend()">确认并匹配岗位</button>
      </div>
    </div>
  `;
}

// ===== Step 2: 岗位选择 =====
function renderJobPicker(container) {
  const jobsHtml = state.jobs.map(job => {
    const active = state.selectedJob === job.title;
    return `
      <button class="job-item ${active ? "active" : ""}" onclick="selectJob('${escapeAttr(job.title)}')">
        <span class="check-dot ${active ? "on" : ""}">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
        <span class="flex-1" style="min-width:0">
          <span class="flex items-center justify-between gap-2">
            <span class="text-sm font-medium">${escapeHtml(job.title)}</span>
            <span class="match-score">${job.matchScore}</span>
          </span>
          <span class="text-xs text-muted leading-relaxed mt-1 block">${escapeHtml(job.matchReason)}</span>
        </span>
      </button>
    `;
  }).join("");
  container.innerHTML = `
    <div class="card p-5">
      <span class="step-badge">Step 3 / 5 · 岗位推荐</span>
      <h2 class="text-lg font-medium mb-5 mt-2">为你推荐的岗位</h2>
      <div class="space-y-3">${jobsHtml}</div>
      <div class="mt-6 flex gap-3">
        <button class="btn btn-ghost" onclick="goToStep(1)">上一步</button>
        <button class="btn btn-primary flex-1" ${!state.selectedJob ? "disabled" : ""} onclick="handleSkills()">查看岗位所需技能</button>
      </div>
    </div>
  `;
}

// ===== Step 3: 技能解析 =====
function renderSkillView(container) {
  if (!state.skills) return;
  const block = (title, items) => {
    if (!items.length) return "";
    const chips = items.map(it => `<span class="chip">${escapeHtml(it)}</span>`).join("");
    return `<div class="skill-block"><h3>${title}</h3><div class="skill-chips">${chips}</div></div>`;
  };
  container.innerHTML = `
    <div class="card p-5">
      <span class="step-badge">Step 4 / 5 · 技能解析</span>
      <h2 class="text-lg font-medium mb-1 mt-2">${escapeHtml(state.selectedJob)} · 技能解析</h2>
      <p class="text-sm text-muted mb-5">要胜任这个岗位，你需要掌握以下基本技能。</p>
      ${block("必备核心技能", state.skills.mustHave)}
      ${block("加分项", state.skills.niceToHave)}
      ${block("常用工具 / 平台", state.skills.tools)}
      <label class="block mt-5">
        <span class="field-label">你的学习目标</span>
        <span class="field-hint">例如：三个月内掌握 Python 数据分析，能独立做清洗与可视化</span>
        <textarea class="input min-h-20" oninput="updateGoal(this.value)" placeholder="告诉我你想达到什么，我来规划学习资源">${escapeHtml(state.goal)}</textarea>
      </label>
      <div class="mt-6 flex gap-3">
        <button class="btn btn-ghost" onclick="goToStep(2)">上一步</button>
        <button class="btn btn-primary flex-1" onclick="handleResources()">生成学习路径</button>
      </div>
    </div>
  `;
}

// ===== Step 4: 学习路径 =====
function renderResourceView(container) {
  const plan = compilePlanText({
    bg: state.bg,
    positioning: state.positioning,
    jobs: state.jobs,
    selectedJob: state.selectedJob,
    skills: state.skills,
    goal: state.goal,
    resources: state.resources
  });
  // 存到全局供复制/下载
  window.__currentPlan = plan;

  const resHtml = state.resources.map(r => `
    <a class="resource-link" href="${r.url}" target="_blank" rel="noopener noreferrer">
      <div class="flex items-center justify-between gap-2">
        <span class="text-sm font-medium">${escapeHtml(r.title)}</span>
        <span class="platform-tag">${escapeHtml(r.platform)}
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17 17 7M9 7h8v8" />
          </svg>
        </span>
      </div>
      <p class="text-xs text-muted leading-relaxed mt-1">${escapeHtml(r.note)}</p>
    </a>
  `).join("");

  container.innerHTML = `
    <div class="card p-5">
      <span class="step-badge">Step 5 / 5 · 学习路径</span>
      <h2 class="text-lg font-medium mb-1 mt-2">${escapeHtml(state.selectedJob)} · 学习路径</h2>
      <p class="text-sm text-muted mb-4">根据你设定的目标，整理出这些可立即开始的学习资源。</p>
      <div class="mb-5 flex gap-2">
        <button class="btn btn-ghost flex-1" onclick="copyPlan()">复制完整规划</button>
        <button class="btn btn-ghost flex-1" onclick="downloadPlan()">下载 .md</button>
      </div>
      <div class="space-y-3">${resHtml}</div>
      <button class="btn btn-ghost w-full mt-6" onclick="reset()">重新开始</button>
    </div>
    <div class="card p-5 mt-5">
      <h3 class="text-sm font-medium mb-2">完整规划预览（Markdown）</h3>
      <pre class="plan-output">${escapeHtml(plan)}</pre>
    </div>
  `;
}

// ===== 事件处理 =====
window.updateBg = function(k, v) { state.bg[k] = v; };
window.updatePosList = function(key, v) {
  state.editPos[key] = v.split("\n").map(s => s.trim()).filter(Boolean);
};
window.updateGoal = function(v) { state.goal = v; };
window.selectJob = function(title) { state.selectedJob = title; render(); };

window.startDemo = function() { state.started = true; state.step = 0; render(); };

window.quickFill = function() {
  state.bg = {
    major: "数据科学与大数据技术",
    grade: "大三",
    works: "用 Trae(AI IDE) 做了一个信息整理 Agent，含 Web 前端交互：提问→拆解→思考→Playwright 检索→报告，含循环+人工干预+可视化进程",
    certificates: "计算机二级、英语四级",
    selfDescription: "双非本科生，能看懂代码但独立写中小型项目有困难，算法弱，擅长用 AI 工具做原型和设计",
    interests: "AI 产品设计、交互设计、数据可视化、对话式交互"
  };
  state.started = true;
  state.step = 0;
  state.error = null;
  render();
};

window.handleLocate = async function() {
  if (!state.bg.major.trim()) { state.error = "请先填写你的专业"; render(); return; }
  state.error = null;
  state.loading = true;
  render();
  const r = await mockCall("locate");
  state.positioning = {
    strengths: r.strengths || [],
    gaps: r.gaps || [],
    directions: r.directions || [],
    summary: r.summary || ""
  };
  state.editPos = JSON.parse(JSON.stringify(state.positioning));
  state.loading = false;
  state.step = 1;
  render();
};

window.handleRecommend = async function() {
  if (!state.editPos) return;
  state.loading = true;
  render();
  const r = await mockCall("refine_recommend");
  state.jobs = r.jobs || [];
  state.loading = false;
  state.step = 2;
  render();
};

window.handleSkills = async function() {
  if (!state.selectedJob) { state.error = "请选择一个岗位"; render(); return; }
  state.error = null;
  state.loading = true;
  render();
  const r = await mockCall("skills");
  state.skills = {
    mustHave: r.mustHave || [],
    niceToHave: r.niceToHave || [],
    tools: r.tools || []
  };
  state.loading = false;
  state.step = 3;
  render();
};

window.handleResources = async function() {
  if (!state.skills) return;
  if (!state.goal.trim()) { state.error = "请填写你的学习目标"; render(); return; }
  state.error = null;
  state.loading = true;
  render();
  const r = await mockCall("resources");
  state.resources = r.resources || [];
  state.loading = false;
  state.step = 4;
  render();
};

window.goToStep = function(i) { if (i >= 0 && i < state.step) { state.step = i; render(); } };
window.goHome = function() { state.started = false; render(); };
window.reset = function() {
  state = {
    started: false, step: 0,
    bg: { major: "", grade: "", works: "", certificates: "", selfDescription: "", interests: "" },
    positioning: null, editPos: null, jobs: [], selectedJob: "",
    skills: null, goal: "", resources: [], loading: false, error: null
  };
  render();
};

window.copyPlan = async function() {
  try {
    await navigator.clipboard.writeText(window.__currentPlan || "");
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = "已复制";
    setTimeout(() => { btn.textContent = orig; }, 1800);
  } catch {}
};

window.downloadPlan = function() {
  const blob = new Blob([window.__currentPlan || ""], { type: "text/markdown;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "职途规划.md";
  a.click();
  URL.revokeObjectURL(url);
};

// ===== 工具函数 =====
function escapeHtml(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function escapeAttr(s) {
  return String(s).replace(/'/g, "\\'");
}

// 启动
render();
</script>

</html>
